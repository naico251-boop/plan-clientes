<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Clientes">
<title>Plan de Clientes · La Bombilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110d;--surface:#1e1a15;--surface2:#29241d;--line:#3a332a;
  --text:#f3ede4;--muted:#a39888;--accent:#ffc53d;--accent-ink:#1b1400;
  --red:#ff6b5b;--orange:#ff9f43;--green:#5fd18b;--radius:14px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root{--bg:#faf7f2;--surface:#ffffff;--surface2:#f2ece2;--line:#e4dccf;
  --text:#221c14;--muted:#7a6f60;--accent:#f0a500;--accent-ink:#1b1400;
  --red:#d9412f;--orange:#d97706;--green:#1f9d57;--shadow:0 8px 30px rgba(60,40,10,.12)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 12px;padding-top:calc(14px + env(safe-area-inset-top))}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px;flex:none;box-shadow:0 0 18px rgba(255,197,61,.35)}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:var(--surface2);border:0;border-radius:10px;width:34px;height:34px;font-size:18px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.sync{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.stat.late b{color:var(--red)}.stat.today b{color:var(--accent)}

h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec .n{background:var(--surface2);border-radius:999px;padding:1px 8px;font-size:11px}
h2.sec.late{color:var(--red)}

.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;border-left:4px solid var(--line)}
.task.late{border-left-color:var(--red)}
.task.soon{border-left-color:var(--orange)}
.task.done{opacity:.55}
.task.done .ttitle{text-decoration:line-through}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:transparent;font-weight:800;color:var(--accent-ink);display:grid;place-items:center;padding:0}
.task.done .chk{background:var(--green);border-color:var(--green)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttitle{font-weight:600;line-height:1.35;word-wrap:break-word}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.task.late .due{color:var(--red);font-weight:600}
.task.soon .due{color:var(--orange);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--text)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.prio{background:rgba(255,107,91,.15);color:var(--red);border-radius:6px;padding:1px 7px;font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.card h3{margin:4px 0 2px;font-size:16px}
.card .sub{color:var(--muted);font-size:12px;min-height:16px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.card .next{margin-top:10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .next b{color:var(--text);font-weight:600}
.badge-late{color:var(--red);font-weight:700}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;border-top:4px solid var(--c)}
.hero .sub{color:var(--muted);font-size:13px}
.hero .big{font-size:28px;font-weight:800}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--surface2);color:var(--text)}

.quick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.quick input[type=text]{flex:1 1 180px}
input[type=text],input[type=date],input[type=url],input[type=password],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.quick input[type=date]{flex:0 0 150px;width:150px}
.quick select{flex:0 0 140px;width:140px}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--surface2);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}

details.done-list summary{cursor:pointer;color:var(--muted);font-size:13px;margin:18px 0 8px;list-style:none}
details.done-list summary::before{content:"▸ "}
details.done-list[open] summary::before{content:"▾ "}

.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.idea p{margin:0 0 8px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.idea .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.idea .foot .sp{flex:1}
.st{border-radius:6px;padding:2px 8px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.st.nueva{background:rgba(255,197,61,.18);color:var(--accent)}
.st.desarrollo{background:rgba(95,160,255,.18);color:#6aa8ff}
.st.convertida{background:rgba(95,209,139,.18);color:var(--green)}
.st.descartada{background:var(--surface2);color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.info dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0}
.info dt{color:var(--muted);font-size:13px}
.info dd{margin:0;word-wrap:break-word;white-space:pre-wrap}

.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--line);border-radius:var(--radius);margin:10px 0}
.empty .e{font-size:34px;margin-bottom:6px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;max-width:760px;width:100%}
nav.bottom button{flex:1;background:transparent;border:0;padding:10px 4px 12px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--accent)}
nav.bottom .bdg{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
nav.bottom .spacer{flex:0 0 76px}

.fab{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:26px;box-shadow:0 6px 24px rgba(255,197,61,.45)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .sp{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}

.mic{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.micbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface2);font-size:24px;flex:none}
.micbtn.rec{background:var(--red);color:#fff;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,107,91,.6)}100%{box-shadow:0 0 0 16px rgba(255,107,91,0)}}
.mic .hint{font-size:13px;color:var(--muted);line-height:1.4}
.detected{font-size:12px;color:var(--green);margin-top:5px;min-height:15px}

.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.set h3{margin:0 0 6px;font-size:16px}
.set p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 12px}
pre.sql{background:var(--surface2);border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre;margin:0 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.muted{color:var(--muted)}

/* ---- V2: fases ---- */
.phhead{display:flex;align-items:center;gap:10px;margin:20px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.phhead .pbar{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.phhead .pbar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.phhead .cnt{font-weight:600;font-size:12px}
.phempty{font-size:12px;color:var(--muted);padding:2px 2px 6px}
.phrow{display:flex;gap:6px;margin-bottom:8px}
.phrow input{flex:1}
.tplopt{display:block;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.tplopt.on{border-color:var(--accent)}

/* ---- V2: calendario ---- */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h3{flex:1;margin:0;text-align:center;font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-day{min-height:54px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.cal-day.today{border-color:var(--accent)}
.cal-day.sel{background:var(--surface2);box-shadow:0 0 0 2px var(--accent) inset}
.cal-day.late .num{color:var(--red)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.cal-dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cal-dots i.dn{opacity:.3}
.cal-more{font-size:9px;color:var(--muted);line-height:7px}

/* ---- V2: pizarra ---- */
.boardwrap{position:relative;height:calc(100dvh - 340px);min-height:400px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.boardwrap.full{position:fixed;inset:0;z-index:40;height:auto;min-height:0;border:0;border-radius:0}
.boardwrap svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.btools{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.boardwrap.full .btools{top:calc(10px + env(safe-area-inset-top))}
.btools .btn{pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 8px 8px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:2;display:none;white-space:nowrap;align-items:center;gap:8px}
.bhint.on{display:flex}
.bhint button{border:0;background:rgba(0,0,0,.15);border-radius:99px;width:26px;height:26px;color:inherit}
.ztitle{font:700 15px Inter,system-ui,sans-serif;fill:var(--text)}
.ntxt{white-space:pre-wrap;word-break:break-word;padding:10px 12px;font:600 14px/1.35 Inter,system-ui,sans-serif;color:#221c14;overflow:hidden;height:100%;box-sizing:border-box;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>

<button class="fab" id="fab" aria-label="Dictar idea" onclick="openIdea(null,null,true)">🎙️</button>

<nav class="bottom"><div class="in">
  <button data-v="hoy" onclick="go('hoy')"><span class="ic">☀️</span>Hoy<span class="bdg" id="bdgLate" hidden></span></button>
  <button data-v="clientes" onclick="go('clientes')"><span class="ic">👥</span>Clientes</button>
  <span class="spacer"></span>
  <button data-v="ideas" onclick="go('ideas')"><span class="ic">💡</span>Ideas<span class="bdg" id="bdgIdeas" hidden></span></button>
  <button data-v="ajustes" onclick="go('ajustes')"><span class="ic">⚙️</span>Ajustes</button>
</div></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden onchange="importJSON(this)">

<script>
/* ============ Datos ============ */
const LS_KEY='lb_plan_clientes_v1', CFG_KEY='lb_plan_clientes_cfg';
const TABLE='plan_clientes_estado', ROW_ID='principal';
const COLORS=['#ffc53d','#ff6b5b','#5fd18b','#6aa8ff','#c08bff','#ff8fc7','#2ec4b6','#ff9f43'];
const NOTE_COLORS=['#fff3a3','#ffc9d6','#c8f1d4','#c7e0ff','#e2d0ff','#ffd9b0'];
const IDEA_ST={nueva:'Nueva',desarrollo:'En desarrollo',convertida:'Convertida',descartada:'Descartada'};
const REPEATS={'':'No se repite',semanal:'Cada semana',quincenal:'Cada 2 semanas',mensual:'Cada mes'};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let S=loadLocal();
let cfg=JSON.parse(lsGet(CFG_KEY)||'{}');
let view={name:'hoy',clientId:null,tab:'plan',ideaFilter:'nueva',hoyMode:'lista',calMonth:'',calDay:'',calClient:'',boardFull:false,lastPhase:''};
let syncState={s:'local',msg:''};

function loadLocal(){
  try{const d=JSON.parse(lsGet(LS_KEY));if(d&&d.clients)return fix(d)}catch(e){}
  return {clients:[],tasks:[],ideas:[],boards:{},savedAt:0};
}
function fix(d){d.clients=d.clients||[];d.tasks=d.tasks||[];d.ideas=d.ideas||[];d.boards=d.boards||{};return d}
function persistLocal(){lsSet(LS_KEY,JSON.stringify(S))}
function save(){S.savedAt=Date.now();persistLocal();schedulePush();render()}
function saveQuiet(){S.savedAt=Date.now();persistLocal();schedulePush()}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clientById=id=>S.clients.find(c=>c.id===id);
const activeClients=()=>S.clients.filter(c=>!c.archived).sort((a,b)=>a.name.localeCompare(b.name,'es'));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ============ Fechas ============ */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const todayStr=()=>ymd(new Date());
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function diffDays(s){return Math.round((parseD(s)-parseD(todayStr()))/86400000)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n,want){const d=parseD(s);const day=want||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)}
function stepDate(s,rep,day){return rep==='mensual'?addMonths(s,1,day):addDays(s,rep==='quincenal'?14:7)}
function repDay(t){return t.repeatDay||(t.due?parseD(t.due).getDate():0)}
function nextDue(t){const day=repDay(t);let n=stepDate(t.due||todayStr(),t.repeat,day);let g=0;while(n<todayStr()&&g++<400)n=stepDate(n,t.repeat,day);return n}
function dateLabel(s){
  if(!s)return'Sin fecha';const n=diffDays(s);
  if(n===0)return'Hoy';if(n===1)return'Mañana';if(n===-1)return'Ayer';
  if(n<0)return`Hace ${-n} días`;
  if(n<7)return cap(parseD(s).toLocaleDateString('es-CO',{weekday:'long'}));
  return parseD(s).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
}
function dueClass(t){if(t.done||!t.due)return'';const n=diffDays(t.due);if(n<0)return'late';if(n<=2)return'soon';return''}
function shortDate(ts){return new Date(ts).toLocaleDateString('es-CO',{day:'numeric',month:'short'})}

/* ============ Sincronización Supabase ============ */
function sbReady(){return !!(cfg.url&&cfg.key)}
function sbHeaders(){return{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'}}
function setSync(s,msg=''){syncState={s,msg};renderTop()}
let pushTimer=null;
function schedulePush(){if(!sbReady())return;clearTimeout(pushTimer);setSync('sync');pushTimer=setTimeout(push,1200)}
async function push(){
  if(!sbReady())return;
  try{
    const r=await fetch(`${cfg.url}/rest/v1/${TABLE}`,{method:'POST',
      headers:{...sbHeaders(),Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify([{id:ROW_ID,data:S,updated_at:new Date().toISOString()}])});
    if(!r.ok)throw new Error('Error '+r.status+' '+(await r.text()).slice(0,120));
    setSync('ok');
  }catch(e){setSync('err',e.message)}
}
async function pull(){
  if(!sbReady()){setSync('local');return}
  setSync('sync');
  try{
    const r=await fetch(`${cfg.url}/rest/v1/${TABLE}?id=eq.${ROW_ID}&select=data`,{headers:sbHeaders()});
    if(!r.ok)throw new Error('Error '+r.status+' '+(await r.text()).slice(0,120));
    const rows=await r.json();
    const remote=rows[0]&&rows[0].data;
    if(remote&&(remote.savedAt||0)>(S.savedAt||0)){S=fix(remote);persistLocal();render();setSync('ok')}
    else if(!remote||(S.savedAt||0)>(remote.savedAt||0)){await push()}
    else setSync('ok');
  }catch(e){setSync('err',e.message)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
setInterval(()=>{if(document.visibilityState==='visible'&&syncState.s!=='sync'&&!B.mode)pull()},60000);

/* ============ Navegación ============ */

/* ============ Tareas ============ */
function pendingTasks(){return S.tasks.filter(t=>!t.done&&clientById(t.clientId)&&!clientById(t.clientId).archived)}
function sortTasks(a,b){if(!a.due&&!b.due)return a.createdAt-b.createdAt;if(!a.due)return 1;if(!b.due)return-1;if(a.due!==b.due)return a.due<b.due?-1:1;return(b.priority==='alta')-(a.priority==='alta')}
function taskRow(t,showClient=true){
  const c=clientById(t.clientId);
  return `<div class="task ${t.done?'done':''} ${dueClass(t)}">
    <button class="chk" onclick="toggleTask('${t.id}')" aria-label="Marcar como hecha">${t.done?'✓':''}</button>
    <div class="tbody" onclick="openTask('${t.id}')">
      <div class="ttitle">${esc(t.title)}</div>
      <div class="tmeta">${showClient&&c?`<span class="chip" style="--c:${c.color}">${esc(c.name)}</span>`:''}<span class="due">📅 ${dateLabel(t.due)}</span>${t.repeat?`<span title="${REPEATS[t.repeat]}">🔁</span>`:''}${t.priority==='alta'?'<span class="prio">Alta</span>':''}${t.notes?'<span>📝</span>':''}</div>
    </div></div>`;
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;
  let msg='✓ ¡Hecho!';
  if(t.done&&t.repeat){
    const nd=nextDue(t);
    const n={...t,id:uid(),done:false,doneAt:null,due:nd,spawnedId:'',repeatDay:repDay(t),createdAt:Date.now()};
    t.spawnedId=n.id;S.tasks.push(n);
    msg=`🔁 Hecho · próxima: ${dateLabel(nd)}`;
  }else if(!t.done&&t.spawnedId){
    const s=S.tasks.find(x=>x.id===t.spawnedId);
    if(s&&!s.done)S.tasks=S.tasks.filter(x=>x.id!==s.id);
    t.spawnedId='';
  }
  save();if(t.done)toast(msg);
}

/* ============ Vista: Hoy ============ */
function viewHoy(){
  if(!activeClients().length)return `<div class="empty" style="margin-top:30px"><div class="e">👋</div><b>Empezá agregando tu primer cliente</b><br><br><button class="btn primary" onclick="openClientForm()">+ Nuevo cliente</button></div>`;
  const p=pendingTasks().sort(sortTasks);
  const late=p.filter(t=>t.due&&diffDays(t.due)<0);
  const today=p.filter(t=>t.due&&diffDays(t.due)===0);
  const week=p.filter(t=>t.due&&diffDays(t.due)>0&&diffDays(t.due)<=7);
  const later=p.filter(t=>t.due&&diffDays(t.due)>7);
  const nodate=p.filter(t=>!t.due);
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt&&ymd(new Date(t.doneAt))===todayStr());
  const ideasN=S.ideas.filter(i=>i.status==='nueva').length;
  const sec=(title,list,cls='')=>list.length?`<h2 class="sec ${cls}">${title}<span class="n">${list.length}</span></h2>${list.map(t=>taskRow(t)).join('')}`:'';
  let h=`<div class="stats">
    <div class="stat late"><b>${late.length}</b><span>Vencidas</span></div>
    <div class="stat today"><b>${today.length}</b><span>Hoy</span></div>
    <div class="stat"><b>${week.length}</b><span>Semana</span></div>
    <div class="stat" onclick="go('ideas',{ideaFilter:'nueva'})" style="cursor:pointer"><b>${ideasN}</b><span>Ideas nuevas</span></div></div>
    <div class="tabs"><button class="${view.hoyMode!=='cal'?'on':''}" onclick="view.hoyMode='lista';render()">📋 Lista</button><button class="${view.hoyMode==='cal'?'on':''}" onclick="view.hoyMode='cal';render()">📅 Calendario</button></div>`;
  if(view.hoyMode==='cal')return h+viewCal();
  if(!late.length&&!today.length)h+=`<div class="empty"><div class="e">🎉</div>Nada pendiente para hoy.${doneToday.length?`<br>Completaste ${doneToday.length} tarea${doneToday.length>1?'s':''} hoy.`:''}</div>`;
  h+=sec('⚠️ Vencidas',late,'late')+sec('Hoy',today)+sec('Próximos 7 días',week)+sec('Más adelante',later)+sec('Sin fecha',nodate);
  if(doneToday.length&&(late.length||today.length))h+=`<details class="done-list"><summary>Completadas hoy (${doneToday.length})</summary>${doneToday.map(t=>taskRow(t)).join('')}</details>`;
  h+=`<div style="margin-top:18px"><button class="btn ghost" style="width:100%" onclick="openTask(null)">+ Nueva tarea</button></div>`;
  return h;
}

/* ============ Calendario ============ */
function calNav(n){const m=view.calMonth||todayStr().slice(0,7);const[Y,M]=m.split('-').map(Number);const d=new Date(Y,M-1+n,1);view.calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');view.calDay='';render()}
function calToday(){view.calMonth=todayStr().slice(0,7);view.calDay=todayStr();render()}
function viewCal(){
  const m=view.calMonth||todayStr().slice(0,7);
  const[Y,M]=m.split('-').map(Number);
  const dim=new Date(Y,M,0).getDate();
  const lead=(new Date(Y,M-1,1).getDay()+6)%7;
  const filt=view.calClient||'';
  const tasks=S.tasks.filter(t=>t.due&&clientById(t.clientId)&&!clientById(t.clientId).archived&&(!filt||t.clientId===filt));
  const by={};tasks.forEach(t=>(by[t.due]=by[t.due]||[]).push(t));
  const td=todayStr();
  const sel=view.calDay&&view.calDay.startsWith(m)?view.calDay:(td.startsWith(m)?td:'');
  let cells=['L','M','X','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<lead;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=`${m}-${String(d).padStart(2,'0')}`;
    const list=by[ds]||[];const pend=list.filter(t=>!t.done);
    const show=pend.length?pend:list;
    const late=pend.length&&ds<td;
    const dots=show.slice(0,4).map(t=>`<i class="${t.done?'dn':''}" style="--c:${clientById(t.clientId).color}"></i>`).join('');
    const more=show.length>4?`<span class="cal-more">+${show.length-4}</span>`:'';
    cells+=`<button class="cal-day ${ds===td?'today':''} ${ds===sel?'sel':''} ${late?'late':''}" data-d="${ds}" onclick="view.calDay='${ds}';render()"><span class="num">${d}</span><span class="cal-dots">${dots}${more}</span></button>`;
  }
  const title=cap(new Date(Y,M-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'}));
  let h=`<div class="quick" style="margin-top:4px"><select id="calFilter" style="flex:1 1 auto;width:auto" onchange="view.calClient=this.value;render()"><option value="">Todos los clientes</option>${activeClients().map(c=>`<option value="${c.id}" ${c.id===filt?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn ghost" onclick="calToday()">Hoy</button></div>
   <div class="cal-head"><button class="btn sm" onclick="calNav(-1)" aria-label="Mes anterior">‹</button><h3>${title}</h3><button class="btn sm" onclick="calNav(1)" aria-label="Mes siguiente">›</button></div>
   <div class="cal-grid">${cells}</div>`;
  if(sel){
    const list=(by[sel]||[]).slice().sort((a,b)=>(a.done-b.done)||sortTasks(a,b));
    const lbl=cap(parseD(sel).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}));
    h+=`<h2 class="sec">${lbl}<span class="n">${list.length}</span></h2>`;
    h+=list.length?list.map(t=>taskRow(t)).join(''):`<div class="empty" style="padding:18px">Sin tareas este día.</div>`;
    h+=`<button class="btn ghost" style="width:100%;margin-top:6px" onclick="openTask(null,{due:'${sel}'${filt?`,clientId:'${filt}'`:''}})">+ Tarea para este día</button>`;
  }else h+=`<div class="empty" style="margin-top:14px">Tocá un día para ver sus tareas.</div>`;
  return h;
}

/* ============ Vista: Clientes ============ */
function clientStats(c){
  const ts=S.tasks.filter(t=>t.clientId===c.id);const done=ts.filter(t=>t.done).length;
  const pend=ts.filter(t=>!t.done).sort(sortTasks);
  return{total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0,next:pend[0],late:pend.filter(t=>t.due&&diffDays(t.due)<0).length,
    ideas:S.ideas.filter(i=>i.clientId===c.id&&i.status==='nueva').length};

    <div class="actions" style="margin:-4px 0 6px"><button class="btn sm ghost" onclick="openPlanTemplates('${c.id}')">📋 Cargar plantilla</button><button class="btn sm ghost" onclick="openPhases('${c.id}')">🗂️ Fases</button></div>`;
    if(!ph.length){
      h+=pend.length?pend.map(t=>taskRow(t,false)).join(''):`<div class="empty"><div class="e">📋</div>Sin tareas pendientes. Agregá la primera arriba o cargá una plantilla.</div>`;
    }else{
      const groups=ph.map(p=>({id:p.id,name:p.name}));

        const all=ts.filter(t=>pid(t)===g.id);const dn=all.filter(t=>t.done).length;
        const pp=pend.filter(t=>pid(t)===g.id);
        h+=`<div class="phhead" style="--c:${c.color}"><span>${esc(g.name)}</span><div class="pbar"><i style="width:${all.length?Math.round(dn/all.length*100):0}%"></i></div><span class="cnt">${dn}/${all.length}</span></div>`;
        h+=pp.length?pp.map(t=>taskRow(t,false)).join(''):`<div class="phempty">${all.length?'Todo listo en esta fase ✓':'Sin tareas en esta fase.'}</div>`;

          <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>

        <g id="bg"></g>
      </svg></div>
      <p class="muted" style="font-size:12px;margin:8px 2px 0">Tocá una nota para editarla · arrastrala para moverla · pellizcá o usá la rueda para el zoom.</p>`;

    h+=`<div class="set info"><dl>${f('Nombre',c.name)}${f('Nombre corto',c.alias)}${f('Sector',c.sector)}${f('Servicio',c.service)}${f('Contacto',c.contact)}${f('Inicio',c.start?parseD(c.start).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}):'')}${f('Notas',c.notes)}</dl></div>

  }
  return h;

/* ============ Fases y plantillas de plan ============ */
let phaseDraft=[];
function openPhases(cid){phaseDraft=((clientById(cid).phases)||[]).map(p=>({...p}));drawPhases(cid)}
function syncDraft(){document.querySelectorAll('#phList input').forEach(i=>{const p=phaseDraft.find(x=>x.id===i.dataset.id);if(p)p.name=i.value})}
function drawPhases(cid){
  openSheet(`<h3>🗂️ Fases del plan</h3>
    <p class="muted" style="font-size:13px;margin:-6px 0 12px">Agrupan las tareas por etapa y muestran el avance de cada una.</p>
    <div id="phList">${phaseDraft.length?phaseDraft.map((p,i)=>`<div class="phrow"><input type="text" data-id="${p.id}" value="${esc(p.name)}"><button class="btn sm ghost" onclick="phMove('${cid}',${i},-1)" aria-label="Subir">▲</button><button class="btn sm ghost" onclick="phMove('${cid}',${i},1)" aria-label="Bajar">▼</button><button class="btn sm danger" onclick="phDel('${cid}',${i})" aria-label="Quitar">✕</button></div>`).join(''):'<p class="muted" style="font-size:13px">Todavía no hay fases.</p>'}</div>
    <div class="quick" style="margin-top:10px"><input type="text" id="phNew" placeholder="Nueva fase…" onkeydown="if(event.key==='Enter')phAdd('${cid}')"><button class="btn primary" onclick="phAdd('${cid}')">Agregar</button></div>
    ${phaseDraft.length?'':`<button class="btn sm ghost" onclick="phSuggest('${cid}')">Usar fases sugeridas</button>`}
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><span class="sp"></span><button class="btn primary" onclick="phSave('${cid}')">Guardar</button></div>`);
}
function phAdd(cid){syncDraft();const i=$('#phNew');const n=i.value.trim();if(!n){i.focus();return}phaseDraft.push({id:uid(),name:n});drawPhases(cid);setTimeout(()=>$('#phNew').focus(),50)}
function phMove(cid,i,d){syncDraft();const j=i+d;if(j<0||j>=phaseDraft.length)return;[phaseDraft[i],phaseDraft[j]]=[phaseDraft[j],phaseDraft[i]];drawPhases(cid)}
function phDel(cid,i){syncDraft();phaseDraft.splice(i,1);drawPhases(cid)}
function phSuggest(cid){phaseDraft=['Planeación','Producción','Publicación','Reporte'].map(name=>({id:uid(),name}));drawPhases(cid)}
function phSave(cid){
  syncDraft();const c=clientById(cid);
  c.phases=phaseDraft.filter(p=>p.name.trim()).map(p=>({id:p.id,name:p.name.trim()}));
  S.tasks.forEach(t=>{if(t.clientId===cid&&t.phaseId&&!c.phases.some(p=>p.id===t.phaseId))t.phaseId=''});
  closeSheet();save();toast('Fases guardadas');
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recBase='',clientTouched=false;
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim()}
function detectClient(text){
  const n=' '+norm(text)+' ';let best=null,len=0;
  for(const c of activeClients())for(const k of [c.name,c.alias]){const kn=norm(k);if(kn.length>=3&&n.includes(' '+kn+' ')&&kn.length>len){best=c;len=kn.length}}
  return best;
}
function cleanIdea(text,c){
  let t=text.trim().replace(/^(agrega(r|le)?|añade|añadir|anota|anotar|guarda|guardar|nueva)?\s*(esta|una|la)?\s*idea\s*(para|a|de|del|al)?\s*(el\s+)?(cliente\s+)?/i,'');
  if(c&&t!==text.trim()){for(const k of [c.name,c.alias].filter(Boolean).sort((a,b)=>b.length-a.length)){if(norm(t.slice(0,k.length))===norm(k)){t=t.slice(k.length);break}}}
  t=t.replace(/^[\s:,.\-–—]+/,'').replace(/^que\s+/i,'');
  return t?t.charAt(0).toUpperCase()+t.slice(1):text.trim();
}

/* ============ Pizarra ============ */
const boardViews={};
let connectFrom=null;
const B={ptrs:new Map(),mode:null,kind:null,id:null,moved:false,sx:0,sy:0,orig:null,carry:null,v0:null,pinch:null};
const snap=v=>Math.round(v/10)*10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function getBoard(cid){return S.boards[cid]||(S.boards[cid]={notes:[],zones:[],arrows:[]})}
function bv(cid){return boardViews[cid]||(boardViews[cid]={x:40,y:80,k:1,fresh:true})}
function boardBounds(b){
  const items=[...b.zones,...b.notes];if(!items.length)return null;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  items.forEach(o=>{x1=Math.min(x1,o.x);y1=Math.min(y1,o.y);x2=Math.max(x2,o.x+o.w);y2=Math.max(y2,o.y+o.h)});
  return{x1,y1,x2,y2};
}
function fitBoard(){
  const svg=$('#bsvg');if(!svg)return;
  const r=svg.getBoundingClientRect();const v=bv(view.clientId);const bb=boardBounds(getBoard(view.clientId));
  if(!bb){v.x=40;v.y=80;v.k=1}
  else{
    const w=bb.x2-bb.x1,h=bb.y2-bb.y1,pad=40,top=70;
    v.k=Math.max(.2,Math.min(1.2,(r.width-pad*2)/w,(r.height-top-pad)/h));
    v.x=(r.width-w*v.k)/2-bb.x1*v.k;
    v.y=top+((r.height-top-pad)-h*v.k)/2-bb.y1*v.k;
  }
  v.fresh=false;drawBoard();
}
function centerWorld(){
  const svg=$('#bsvg');const r=svg.getBoundingClientRect();const v=bv(view.clientId);
  return{x:(r.width/2-v.x)/v.k,y:(r.height/2-v.y)/v.k};
}
function edgePt(n,px,py){
  const cx=n.x+n.w/2,cy=n.y+n.h/2,dx=px-cx,dy=py-cy;
  if(!dx&&!dy)return{x:cx,y:cy};
  const s=Math.min((n.w/2+4)/Math.abs(dx||1e-9),(n.h/2+4)/Math.abs(dy||1e-9));
  return{x:cx+dx*s,y:cy+dy*s};
}
function drawBoard(){
  const g=$('#bg');if(!g)return;
  const cid=view.clientId,b=getBoard(cid),v=bv(cid);
  g.setAttribute('transform',`translate(${v.x},${v.y}) scale(${v.k})`);
  let h='<rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#bdots)"/>';
  b.zones.forEach(z=>{
    h+=`<g data-kind="zone" data-id="${z.id}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14" fill="${z.color}" fill-opacity=".13" stroke="${z.color}" stroke-width="2" stroke-dasharray="8 6"/><text class="ztitle" x="${z.x+14}" y="${z.y+27}">${esc(z.title||'Zona')}</text></g>`;
  });
  b.arrows.forEach(a=>{
    const f=b.notes.find(n=>n.id===a.from),t=b.notes.find(n=>n.id===a.to);if(!f||!t)return;
    const p1=edgePt(f,t.x+t.w/2,t.y+t.h/2),p2=edgePt(t,f.x+f.w/2,f.y+f.h/2);
    h+=`<g data-kind="arrow" data-id="${a.id}"><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="transparent" stroke-width="22"/><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" style="stroke:var(--muted)" stroke-width="2.5" marker-end="url(#arh)"/></g>`;
  });
  b.notes.forEach(n=>{
    const hot=connectFrom===n.id;
    h+=`<g data-kind="note" data-id="${n.id}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="${n.color}" stroke="${hot?'#ff6b5b':'rgba(0,0,0,.22)'}" stroke-width="${hot?4:1}"/><foreignObject x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"><div xmlns="http://www.w3.org/1999/xhtml" class="ntxt">${n.text?esc(n.text):'<span style="opacity:.45">Nota vacía</span>'}</div></foreignObject>${n.taskId?`<text x="${n.x+n.w-24}" y="${n.y+20}" font-size="14">✅</text>`:''}<g data-kind="nhandle" data-id="${n.id}" transform="translate(${n.x+n.w-24},${n.y+n.h-24})"><rect width="24" height="24" fill="transparent"/><path d="M8 21 L21 8 M14 21 L21 14" stroke="#221c14" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/></g></g>`;
  });
  /* asas de las zonas al final: siempre quedan por encima de las notas y se pueden agarrar */
  b.zones.forEach(z=>{
    h+=`<g data-kind="zhandle" data-id="${z.id}" transform="translate(${z.x+z.w-24},${z.y+z.h-24})"><rect width="24" height="24" fill="transparent"/><path d="M8 21 L21 8 M14 21 L21 14" stroke="${z.color}" stroke-width="3" stroke-linecap="round"/></g>`;
  });
  g.innerHTML=h;
}
function initBoard(){
  const svg=$('#bsvg');if(!svg)return;
  svg.addEventListener('pointerdown',bDown);svg.addEventListener('pointermove',bMove);
  svg.addEventListener('pointerup',bUp);svg.addEventListener('pointercancel',bUp);
  svg.addEventListener('wheel',bWheel,{passive:false});
  B.ptrs.clear();B.mode=null;
  if(bv(view.clientId).fresh)fitBoard();else drawBoard();
  updateHint();
}
function updateHint(){const h=$('#bhint');if(h)h.classList.toggle('on',!!connectFrom)}
function toggleFull(){view.boardFull=!view.boardFull;bv(view.clientId).fresh=true;render()}
function ptr(e){const r=e.currentTarget.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function bDown(e){
  const svg=e.currentTarget;
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  B.ptrs.set(e.pointerId,ptr(e));
  if(B.ptrs.size===2){startPinch();return}
  if(B.ptrs.size>2)return;
  const el=e.target.closest?e.target.closest('[data-kind]'):null;
  const p=B.ptrs.get(e.pointerId);B.sx=p.x;B.sy=p.y;B.moved=false;B.carry=null;
  const b=getBoard(view.clientId),v=bv(view.clientId);
  B.kind=el?el.dataset.kind:'bg';B.id=el?el.dataset.id:null;
  if(B.kind==='note'){const n=b.notes.find(x=>x.id===B.id);B.orig={x:n.x,y:n.y};B.mode='drag'}
  else if(B.kind==='zone'){
    const z=b.zones.find(x=>x.id===B.id);B.orig={x:z.x,y:z.y};
    B.carry=b.notes.filter(n=>{const cx=n.x+n.w/2,cy=n.y+n.h/2;return cx>=z.x&&cx<=z.x+z.w&&cy>=z.y&&cy<=z.y+z.h}).map(n=>({id:n.id,x:n.x,y:n.y}));
    B.mode='drag';
  }
  else if(B.kind==='nhandle'){const n=b.notes.find(x=>x.id===B.id);B.orig={w:n.w,h:n.h};B.mode='resize'}
  else if(B.kind==='zhandle'){const z=b.zones.find(x=>x.id===B.id);B.orig={w:z.w,h:z.h};B.mode='resize'}
  else if(B.kind==='arrow'){B.mode='tap'}
  else{B.mode='pan';B.v0={x:v.x,y:v.y}}
}
function startPinch(){
  const pts=[...B.ptrs.values()];const v=bv(view.clientId);
  const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
  B.mode='pinch';B.moved=true;
  B.pinch={d0:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,k0:v.k,wx:(cx-v.x)/v.k,wy:(cy-v.y)/v.k};
}
function bMove(e){
  if(!B.ptrs.has(e.pointerId))return;
  const p=ptr(e);B.ptrs.set(e.pointerId,p);
  const cid=view.clientId,v=bv(cid),b=getBoard(cid);
  if(B.mode==='pinch'){
    const pts=[...B.ptrs.values()];if(pts.length<2)return;
    const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    v.k=clamp(B.pinch.k0*d/B.pinch.d0,.15,3);v.x=cx-B.pinch.wx*v.k;v.y=cy-B.pinch.wy*v.k;drawBoard();return;
  }
  if(!B.mode)return;
  const dx=p.x-B.sx,dy=p.y-B.sy;
  if(!B.moved&&Math.hypot(dx,dy)<6)return;
  B.moved=true;
  if(B.mode==='pan'){v.x=B.v0.x+dx;v.y=B.v0.y+dy}
  else if(B.mode==='drag'){
    const wx=dx/v.k,wy=dy/v.k;
    if(B.kind==='note'){const n=b.notes.find(x=>x.id===B.id);n.x=snap(B.orig.x+wx);n.y=snap(B.orig.y+wy)}
    else{const z=b.zones.find(x=>x.id===B.id);const zx=snap(B.orig.x+wx),zy=snap(B.orig.y+wy);const ddx=zx-B.orig.x,ddy=zy-B.orig.y;z.x=zx;z.y=zy;
      B.carry.forEach(c=>{const n=b.notes.find(x=>x.id===c.id);if(n){n.x=c.x+ddx;n.y=c.y+ddy}})}
  }
  else if(B.mode==='resize'){
    const obj=(B.kind==='nhandle'?b.notes:b.zones).find(x=>x.id===B.id);
    const minW=B.kind==='nhandle'?110:160,minH=B.kind==='nhandle'?60:100;
    obj.w=Math.max(minW,snap(B.orig.w+dx/v.k));obj.h=Math.max(minH,snap(B.orig.h+dy/v.k));
  }
  drawBoard();
}
function bUp(e){
  B.ptrs.delete(e.pointerId);
  if(B.mode==='pinch'){if(B.ptrs.size<2){B.mode=null;B.pinch=null}return}
  const mode=B.mode,moved=B.moved;B.mode=null;
  if(!mode)return;
  if((mode==='drag'||mode==='resize')&&moved){saveQuiet();return}
  if(moved)return;
  if(mode==='drag'){
    if(B.kind==='note'){
      if(connectFrom){
        if(connectFrom!==B.id){
          const b=getBoard(view.clientId);
          if(!b.arrows.some(a=>a.from===connectFrom&&a.to===B.id))b.arrows.push({id:uid(),from:connectFrom,to:B.id});
          saveQuiet();toast('Flecha creada');
        }
        connectFrom=null;updateHint();drawBoard();
      }else openNote(B.id);
    }else if(B.kind==='zone'){if(!connectFrom)openZone(B.id)}
  }else if(mode==='tap'){
    if(confirm('¿Eliminar esta flecha?')){const b=getBoard(view.clientId);b.arrows=b.arrows.filter(a=>a.id!==B.id);saveQuiet();drawBoard()}
  }
}
function bWheel(e){
  e.preventDefault();
  const v=bv(view.clientId);const r=e.currentTarget.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  const wx=(sx-v.x)/v.k,wy=(sy-v.y)/v.k;
  v.k=clamp(v.k*(e.deltaY<0?1.1:.9),.15,3);v.x=sx-wx*v.k;v.y=sy-wy*v.k;drawBoard();
}

/* Notas */
let noteColor=NOTE_COLORS[0],zoneColor=COLORS[0];
function newNote(){
  const b=getBoard(view.clientId);const c=centerWorld();const off=(b.notes.length%5)*14;
  const n={id:uid(),x:snap(c.x-90+off),y:snap(c.y-50+off),w:180,h:100,text:'',color:NOTE_COLORS[b.notes.length%NOTE_COLORS.length]};
  b.notes.push(n);saveQuiet();drawBoard();openNote(n.id,true);
}
function openNote(id,isNew){
  const b=getBoard(view.clientId);const n=b.notes.find(x=>x.id===id);if(!n)return;
  noteColor=n.color;
  openSheet(`<h3>${isNew?'Nueva nota':'Nota'}</h3>
    <div class="field"><textarea id="nText" placeholder="Escribí la idea…" style="min-height:110px">${esc(n.text)}</textarea></div>
    <div class="field"><label>Color</label><div class="swatches" id="nsw">${NOTE_COLORS.map(k=>`<button style="background:${k}" class="${k===n.color?'on':''}" onclick="pickNoteColor('${k}')"></button>`).join('')}</div></div>
    <div class="actions" style="margin-top:6px"><button class="btn sm ghost" onclick="noteToTask('${id}')">→ Tarea</button><button class="btn sm ghost" onclick="startConnect('${id}')">🔗 Conectar</button><button class="btn sm ghost" onclick="dupNote('${id}')">⎘ Duplicar</button></div>
    <div class="actions"><button class="btn danger" onclick="delNote('${id}')">Eliminar</button><span class="sp"></span><button class="btn primary" onclick="saveNote('${id}')">Listo</button></div>`);
  setTimeout(()=>{const t=$('#nText');if(t)t.focus()},80);
}
function pickNoteColor(k){noteColor=k;document.querySelectorAll('#nsw button').forEach(x=>x.classList.toggle('on',x.getAttribute('onclick').includes(k)))}
function saveNote(id){
  const n=getBoard(view.clientId).notes.find(x=>x.id===id);if(!n)return;
  n.text=$('#nText').value.trim();n.color=noteColor;
  saveQuiet();closeSheet();drawBoard();
}
function delNote(id){
  const b=getBoard(view.clientId);const n=b.notes.find(x=>x.id===id);
  if(n&&n.text&&!confirm('¿Eliminar esta nota?'))return;
  b.notes=b.notes.filter(x=>x.id!==id);b.arrows=b.arrows.filter(a=>a.from!==id&&a.to!==id);
  saveQuiet();closeSheet();drawBoard();
}
function dupNote(id){
  const b=getBoard(view.clientId);const n=b.notes.find(x=>x.id===id);if(!n)return;
  b.notes.push({...n,id:uid(),x:n.x+30,y:n.y+30,text:$('#nText')?$('#nText').value.trim():n.text,color:noteColor,taskId:''});
  saveQuiet();closeSheet();drawBoard();toast('Nota duplicada');
}
function startConnect(id){
  const n=getBoard(view.clientId).notes.find(x=>x.id===id);if(n){n.text=$('#nText').value.trim();n.color=noteColor;saveQuiet()}
  connectFrom=id;closeSheet();updateHint();drawBoard();
}
function cancelConnect(){connectFrom=null;updateHint();drawBoard()}
function noteToTask(id){
  const n=getBoard(view.clientId).notes.find(x=>x.id===id);if(!n)return;
  const text=($('#nText')?$('#nText').value:n.text).trim();
  if(!text){toast('Escribí algo en la nota primero');return}
  n.text=text;n.color=noteColor;saveQuiet();
  const first=text.split('\n')[0];
  openTask(null,{title:first.length>140?first.slice(0,140)+'…':first,clientId:view.clientId,notes:(text!==first||first.length>140)?text:'',fromNote:id});
}

/* Zonas */
function newZone(){
  const b=getBoard(view.clientId);const c=centerWorld();
  const z={id:uid(),x:snap(c.x-160),y:snap(c.y-110),w:320,h:220,title:'',color:COLORS[b.zones.length%COLORS.length]};
  b.zones.push(z);saveQuiet();drawBoard();openZone(z.id,true);
}
function openZone(id,isNew){
  const z=getBoard(view.clientId).zones.find(x=>x.id===id);if(!z)return;
  zoneColor=z.color;
  openSheet(`<h3>${isNew?'Nueva zona':'Zona'}</h3>
    <div class="field"><label>Título</label><input type="text" id="zTitle" value="${esc(z.title)}" placeholder="Ej: Objetivos, Contenido, Pauta"></div>
    <div class="field"><label>Color</label><div class="swatches" id="zsw">${COLORS.map(k=>`<button style="background:${k}" class="${k===z.color?'on':''}" onclick="pickZoneColor('${k}')"></button>`).join('')}</div></div>
    <p class="muted" style="font-size:12px;margin:0">Arrastrá la zona desde un espacio vacío para moverla junto con sus notas. Tirá de la esquina inferior derecha para cambiar el tamaño.</p>
    <div class="actions"><button class="btn danger" onclick="delZone('${id}')">Eliminar zona</button><span class="sp"></span><button class="btn primary" onclick="saveZone('${id}')">Listo</button></div>`);
  setTimeout(()=>{const t=$('#zTitle');if(t)t.focus()},80);
}
function pickZoneColor(k){zoneColor=k;document.querySelectorAll('#zsw button').forEach(x=>x.classList.toggle('on',x.getAttribute('onclick').includes(k)))}
function saveZone(id){const z=getBoard(view.clientId).zones.find(x=>x.id===id);if(!z)return;z.title=$('#zTitle').value.trim();z.color=zoneColor;saveQuiet();closeSheet();drawBoard()}
function delZone(id){const b=getBoard(view.clientId);b.zones=b.zones.filter(x=>x.id!==id);saveQuiet();closeSheet();drawBoard();toast('Zona eliminada (las notas se quedan)')}

    notes:[[80,70,'¿Qué hacemos mejor que nadie?',2],[440,70,'¿Qué tendencias o vacíos del mercado podemos aprovechar?',3],[80,350,'¿Qué nos falta o debemos mejorar?',5],[440,350,'¿Qué competencia o cambios nos afectan?',1]]}

function openBoardTpl(){
  openSheet(`<h3>🧩 Plantillas de pizarra</h3>
    <p class="muted" style="font-size:13px;margin:-6px 0 12px">Se agregan al lienzo actual, debajo de lo que ya tengas.</p>
    ${Object.entries(BOARD_TPL).map(([k,t])=>`<div class="tplopt" onclick="addBoardTpl('${k}')"><b>${t.ico} ${t.name}</b><div class="muted" style="font-size:12px;margin-top:3px">${t.desc}</div></div>`).join('')}
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button></div>`);
}
function addBoardTpl(k){
  const tpl=BOARD_TPL[k];const b=getBoard(view.clientId);const bb=boardBounds(b);
  const ox=bb?bb.x1:0,oy=bb?bb.y2+80:0;
  tpl.zones.forEach(([x,y,w,h,title,ci])=>b.zones.push({id:uid(),x:x+ox,y:y+oy,w,h,title,color:COLORS[ci%COLORS.length]}));
  tpl.notes.forEach(([x,y,text,ci])=>b.notes.push({id:uid(),x:x+ox,y:y+oy,w:180,h:100,text,color:NOTE_COLORS[ci%NOTE_COLORS.length]}));
  saveQuiet();closeSheet();fitBoard();toast(`${tpl.name} agregado`);
}
